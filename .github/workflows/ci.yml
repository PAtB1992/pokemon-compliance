name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: #test


jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm run test -- --coverage
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend installieren, bauen und starten
        working-directory: backend
        run: |
          npm install
          npm run build
          nohup node dist/main.js &
          npx wait-on http://localhost:3000/trainers

      - name: Frontend installieren
        working-directory: frontend
        run: npm install

      - name: Cypress gegen "ng serve" ausfuehren
        working-directory: frontend
        run: npx start-server-and-test start http://localhost:4200 e2e:ci

      - name: Cypress-Screenshots hochladen (nur bei Fehlschlag)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots

  deploy:
    needs: [e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # "environment: production" mit Required Reviewers in den Repo-Settings ist das
    # Approval-Gate aus der Ausschreibung ("achieve approval" / "release after
    # confirmation") - siehe Kapitel "GitHub Actions" im Interview-Guide.
    environment: production
    steps:
      - run: echo "Hier wuerde das Deployment laufen (z. B. cf push auf SAP BTP Cloud Foundry)."
